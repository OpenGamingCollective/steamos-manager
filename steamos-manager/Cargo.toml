[package]
name = "steamos-manager"
version = "26.4.1"
edition = "2024"
repository = "https://gitlab.steamos.cloud/holo/steamos-manager/"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cecd-proxy = { version = "0.2" }
clap = { version = "4.5", default-features = false, features = ["derive", "help", "std", "usage"] }
config = { version = "0.15", default-features = false, features = ["async", "ini", "toml"] }
gio = "0.21"
glob = "0.3"
inotify = { version = "0.11", default-features = false, features = ["stream"] }
input-linux = "0.7"
itertools = "0.14"
linux-cec = { version = "0.2", default-features = false, features = ["serde"] }
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "signal", "time", "user"] }
num_enum = "0.7"
regex = { version = "1", default-features = false, features = ["unicode-perl"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
speech-dispatcher = "0.16"
steamos-manager-macros = { path = "../steamos-manager-macros" }
steamos-manager-proxy = { path = "../steamos-manager-proxy" }
strum = { version = "0.28", features = ["derive"] }
sysinfo = "0.38"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
toml = "1.1"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
udev = { version = "^0.9.3", features = ["send", "sync"] }
xdg = "3.0"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_xml = "5"

[features]
default = []
wifi-backend-switching = []
