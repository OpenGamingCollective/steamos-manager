[[device]]
dmi.sys_vendor = "ASUSTeK COMPUTER INC."
dmi.board_name = "GZ302EA"
device = "rog_flow_z13_2025"
variant = "GZ302EA"

[gpu_performance]
driver = "amdgpu"

[gpu_power_profile]
driver = "amdgpu"

[performance_profile]
# until custom mode is added
suggested_default = "performance"

[performance_profile.driver.acpi]
name = "asus-wmi"

[tdp_limit]
method = "firmware_attribute"

[tdp_limit.firmware_attribute]
attribute = "asus-armoury"
# until custom mode is added
performance_profile = "performance"

[battery_charge_limit]
method = "acpi_sb"